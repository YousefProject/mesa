{{define "content"}}
<div class="page-head">
  <div>
    <h1 class="mono">{{.Ticket.Ref}}</h1>
    <h2 class="subject-title">Editar ticket</h2>
  </div>
  <a class="btn btn-ghost" href="/tickets/{{.Ticket.ID}}">Cancelar</a>
</div>

<form method="post" action="/tickets/{{.Ticket.ID}}/edit" class="card stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Asunto</label>
  <input type="text" name="subject" maxlength="200" required autofocus value="{{.Ticket.Subject}}">

  <label>Descripción</label>
  <textarea name="description" rows="12">{{.Ticket.Description}}</textarea>

  <p class="muted small">Estado, prioridad, cola y asignado se cambian desde el panel lateral del ticket.</p>

  <div class="actions">
    <button class="btn btn-primary" type="submit">Guardar cambios</button>
    <a class="btn btn-ghost" href="/tickets/{{.Ticket.ID}}">Cancelar</a>
  </div>
</form>
{{end}}
